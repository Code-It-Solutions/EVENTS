# /etc/nginx/conf.d/afrionex-events.conf (same pattern as afrionex-connect.conf)
server {
    listen 178.162.240.53:80;
    server_name events.afrionexsolutions.com;
    location /.well-known/acme-challenge/ { root /var/www/afrionex-events-acme; }
    location / { return 301 https://events.afrionexsolutions.com$request_uri; }
}
server {
    listen 178.162.240.53:443 ssl;
    server_name events.afrionexsolutions.com;
    ssl_certificate /etc/letsencrypt/live/events.afrionexsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.afrionexsolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:3130;
        proxy_set_header Host events.afrionexsolutions.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
