<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172443">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Complete Profile - {{ brand_name|default('Afrionex Events') }}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --afx-navy: #172443;
            --afx-teal: #0d9488;
            --afx-teal-soft: #f0fdfa;
            --afx-cta: #c2410c;
            --afx-cta-hover: #9a3412;
            --afx-bg: #f8fafc;
            --afx-border: #e2e8f0;
        }
        
        * { font-family: 'Manrope', system-ui, sans-serif; }
        h1, h2, h3, h4, .afx-wordmark { font-family: 'Sora', 'Manrope', sans-serif; letter-spacing: -0.025em; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0e172c 0%, #172443 55%, #1e3a5f 100%);
            padding: 24px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .profile-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.45);
            max-width: 520px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .profile-header {
            background: linear-gradient(135deg, #172443 0%, #1e3a5f 100%);
            padding: 32px 28px;
            text-align: center;
            color: #ffffff;
            position: relative;
        }
        
        .profile-picture {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 3.5px solid #2dd4bf;
            margin-bottom: 14px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        
        .profile-body {
            padding: 32px 28px;
        }
        
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        
        .role-option {
            display: block;
            text-align: center;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s ease;
            user-select: none;
            border: 1px solid transparent;
        }
        
        .role-option input { display: none; }
        
        .role-option.active {
            background: #ffffff;
            color: #172443;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
            border-color: #e2e8f0;
        }
        
        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }
        
        .form-control, .form-select {
            border-radius: 12px;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            font-size: 14px;
            color: #0f172a;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }
        
        .btn-save {
            background: var(--afx-cta);
            color: #ffffff;
            border: none;
            padding: 13px 28px;
            font-weight: 700;
            border-radius: 999px;
            width: 100%;
            font-size: 14.5px;
            box-shadow: 0 8px 20px -4px rgba(194, 65, 12, 0.4);
            transition: all 0.25s ease;
        }
        
        .btn-save:hover {
            background: var(--afx-cta-hover);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -4px rgba(194, 65, 12, 0.5);
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="profile-header">
            {% if current_user.profile_picture %}
            <img src="{{ current_user.profile_picture }}" class="profile-picture" alt="Profile">
            {% else %}
            <div class="profile-picture bg-white d-inline-flex align-items-center justify-content-center text-dark">
                <i class="bi bi-person-fill" style="font-size: 2.2rem; color: #172443;"></i>
            </div>
            {% endif %}
            <h4 class="mb-1 text-white">Welcome, {{ current_user.name }}!</h4>
            <p class="mb-0 text-white-50 small">Complete your account details to get started</p>
        </div>
        
        <div class="profile-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Role Selector -->
                <div class="role-selector">
                    <label class="role-option {% if current_user.role == 'organizer' or not current_user.role or current_user.role == 'user' %}active{% endif %}" id="labelOrganizer">
                        <input type="radio" name="role" value="organizer" {% if current_user.role == 'organizer' or not current_user.role or current_user.role == 'user' %}checked{% endif %}>
                        <i class="bi bi-calendar-check me-1"></i> Event Organizer
                    </label>
                    <label class="role-option {% if current_user.role == 'chair' %}active{% endif %}" id="labelChurch">
                        <input type="radio" name="role" value="chair" {% if current_user.role == 'chair' %}checked{% endif %}>
                        <i class="bi bi-bank me-1"></i> Church / Diocese
                    </label>
                </div>

                <!-- Phone number (Shared) -->
                <div class="mb-3">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="0712345678" value="{{ current_user.phone or '' }}" required>
                    <div class="form-text text-muted" style="font-size: 11.5px;">Used for gate check-in and M-Pesa receipts.</div>
                </div>

                <!-- Organizer Section -->
                <div id="organizerFields">
                    <div class="mb-3">
                        <label class="form-label" for="organization">Organization / Company / Brand Name</label>
                        <input type="text" id="organization" name="organization" class="form-control" placeholder="e.g. Nairobi Tech Summit, St. Jude's, Independent" value="{{ current_user.local_church or '' }}">
                    </div>
                </div>

                <!-- Church / Diocese Section -->
                <div id="churchFields" style="display: none;">
                    <div class="mb-3">
                        <label class="form-label" for="local_church">Local Church</label>
                        <input type="text" id="local_church" name="local_church" class="form-control" placeholder="Your local church">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="archdeaconry">Archdeaconry</label>
                            <select name="archdeaconry" id="archdeaconry" class="form-select">
                                <option value="">Select Archdeaconry</option>
                                {% for arch in archdeaconries %}
                                <option value="{{ arch }}" {% if current_user.archdeaconry == arch %}selected{% endif %}>{{ arch }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="parish">Parish</label>
                            <select name="parish" id="parish" class="form-select">
                                <option value="">Select Parish</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-save mt-3">
                    <i class="bi bi-arrow-right-circle me-2"></i>Save &amp; Continue
                </button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{% if current_user.role == 'organizer' %}{{ url_for('events.list_events') }}{% else %}{{ url_for('main.dashboard') }}{% endif %}" class="text-muted small text-decoration-none">
                    Skip for now &rarr;
                </a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const parishData = {
            'Amagoro': ['Amagoro', 'Kamolo', 'Kakapel', 'Osajai', 'Okatekok'],
            'Angurai': ['Angurai', 'Moding', 'Obekai', 'Ikapolok'],
            'Budalangi': ['Budalangi', 'Mudembi', 'Mundere', 'Rukala', 'Siginga'],
            'Busia': ['Busia Township', 'Nambale', 'Lwanya', 'Munongo', 'Nasewa'],
            'Butula': ['Butula', 'Bumala A', 'Bumala B', 'Kingandole', 'Elukhari'],
            'Funyula': ['Funyula', 'Nangina', 'Namboboto', 'Sifuyo', 'Odiado'],
            'Matayos': ['Matayos', 'Bujumba', 'Mayenje', 'Burumba'],
            'Teso North': ['Malaba', 'Kolanya', 'Amagoro Town', 'Chakol'],
            'Teso South': ['Amukura', 'Angorom', 'Apokor', 'Kotur']
        };
        
        const orgLabel = document.getElementById('labelOrganizer');
        const churchLabel = document.getElementById('labelChurch');
        const orgFields = document.getElementById('organizerFields');
        const churchFields = document.getElementById('churchFields');
        
        function updateRoleView() {
            const isOrg = orgLabel.querySelector('input').checked;
            if (isOrg) {
                orgLabel.classList.add('active');
                churchLabel.classList.remove('active');
                orgFields.style.display = 'block';
                churchFields.style.display = 'none';
            } else {
                churchLabel.classList.add('active');
                orgLabel.classList.remove('active');
                orgFields.style.display = 'none';
                churchFields.style.display = 'block';
            }
        }
        
        orgLabel.addEventListener('click', function() {
            orgLabel.querySelector('input').checked = true;
            updateRoleView();
        });
        
        churchLabel.addEventListener('click', function() {
            churchLabel.querySelector('input').checked = true;
            updateRoleView();
        });
        
        updateRoleView();
        
        document.getElementById('archdeaconry').addEventListener('change', function() {
            const parishes = parishData[this.value] || [];
            const parishSelect = document.getElementById('parish');
            parishSelect.innerHTML = '<option value="">Select Parish</option>';
            parishes.forEach(p => {
                parishSelect.innerHTML += `<option value="${p}">${p}</option>`;
            });
        });
    </script>
</body>
</html>
